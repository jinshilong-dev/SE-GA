[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gui-sega"
version = "0.1.0"
description = "GUI Agent Training & Inference Framework with TTME Memory"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["gui_sega*", "inference*"]