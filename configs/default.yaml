model:
  compute_dtype: "float16"
  attn_implementation: "flash_attention_2"
  min_pixels: 65536
  max_pixels: 6553600

env:
  SWANLAB_PROJECT: "gui-sega"

grounding_sft:
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  dataset_path: "dataset/grounding_sft/train_sft_click_data.json"
  image_dir: "dataset/grounding_sft/"
  output_dir_check: "./checkpoint/grounding_sft"
  output_dir_final: "./model/grounding_sft"
  run_name: "qwen25vl-grounding-sft"
  learning_rate: 1.0e-6
  adam_beta1: 0.9
  adam_beta2: 0.95
  weight_decay: 0.1
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  optim: "adamw_torch_8bit"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  num_train_epochs: 3
  save_steps: 500
  max_grad_norm: 1
  logging_steps: 1
  report_to: "swanlab"
  image_resize: 1000
  enable_gradient_checkpointing: true
  use_lora: false

planning_sft:
  model_id: "./model/grounding_sft"
  dataset_path: "dataset/planning_sft/gui_sft_thinking_data_train.json"
  dataset_eval_path: "dataset/planning_sft/gui_sft_thinking_data_train_eval.json"
  image_dir: "dataset/planning_sft/"
  output_dir_check: "./checkpoint/planning-sft"
  output_dir_final: "./model/planning_sft"
  run_name: "qwen25vl-planning-sft"
  learning_rate: 1.0e-6
  adam_beta1: 0.9
  adam_beta2: 0.95
  weight_decay: 0.1
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  optim: "adamw_torch_8bit"
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  num_train_epochs: 2
  save_steps: 3000
  max_grad_norm: 1
  logging_steps: 1
  report_to: "swanlab"
  eval_steps: 200
  eval_strategy: "steps"
  do_eval: true
  train_data_limit: 1600
  eval_data_limit: 160
  image_resize: 1000
  enable_gradient_checkpointing: false
  use_lora: false
  max_history_steps: 10

grpo:
  model_id: "./model/planning_sft"
  dataset_path: "dataset/rl/gui_rl_data_train.json"
  dataset_test_path: "dataset/test_guiodyssey/gui_data_test.json"
  image_dir: "dataset/rl/"
  image_dir_test: "dataset/test_guiodyssey/"
  output_dir_check: "./checkpoint/rl"
  output_dir_final: "./model/rl"
  run_name: "qwen25vl-rl"
  compute_dtype: "bfloat16"
  deepspeed_config: "ds_z3_offload_config.json"
  learning_rate: 3.0e-6
  adam_beta1: 0.9
  adam_beta2: 0.95
  weight_decay: 0.1
  lr_scheduler_type: "constant"
  optim: "adamw_torch_8bit"
  beta: 0.001
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8
  num_generations: 16
  num_train_epochs: 3
  save_steps: 250
  max_grad_norm: 1
  logging_steps: 1
  report_to: "swanlab"
  eval_steps: 250
  eval_strategy: "steps"
  do_eval: true
  max_prompt_length: 6144
  max_completion_length: 1024
  epsilon_high: 0.3
  use_vllm: true
  vllm_mode: "colocate"
  bf16: true
  fp16: false
  gradient_checkpointing: true
  train_data_limit: 200
  eval_data_limit: 20
  image_resize: 1000
  max_history_steps: 10
  use_lora: true
  lora_r: 32
  lora_alpha: 64
  lora_target_modules: "all-linear"
  lora_bias: "none"
  gpu_num: 2
